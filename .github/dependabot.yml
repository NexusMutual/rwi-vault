version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Hold routine version updates for 24h so a compromised release is caught
    # before it reaches a PR. Security updates are exempt by design.
    cooldown:
      default-days: 1
    groups:
      # Collapse routine development-dependency version bumps into a single PR.
      development-dependencies:
        dependency-type: "development"
      # Collapse security updates into a single PR so they don't pile up
      # individually (as #32–#37 did).
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
