# Release Workflow
#
# Entry point for all npm publishing of @nexusmutual/rwi-vault-deployments.
# Handles both the production (@latest) and release-candidate (@next) channels
# through a single workflow, because npm trusted publishing authorises one
# workflow file rather than a repository.
#
# Triggered manually. Pick the channel when dispatching:
# - next   builds an RC from dev and publishes it under '@next'. Commits nothing.
# - latest bumps the version, fast-forwards master, tags, publishes '@latest',
#          then opens version bump PRs in the repositories that consume it.
#
# Publishing uses OIDC, so no npm token is stored here. The package is
# registered on npm with this repository and this workflow file as its trusted
# publisher; renaming the file breaks publishing until npm is updated to match.

name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which npm tag to publish"
        type: choice
        options:
          - next
          - latest
        default: next

permissions:
  contents: read

# Both channels publish the same package and derive versions from the same
# tags, so they must not run concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prep-next:
    if: inputs.channel == 'next'
    uses: ./.github/workflows/prep-next.yml
    secrets: inherit

  prep-latest:
    if: inputs.channel == 'latest'
    uses: ./.github/workflows/prep-latest.yml
    secrets: inherit

  publish:
    needs: [prep-next, prep-latest]
    # Only one prep job runs and the other is skipped, so the run is judged on
    # whichever produced an artifact.
    if: >-
      always() &&
      ((needs.prep-next.result == 'success' && needs.prep-next.outputs.artifact_name != '') ||
       (needs.prep-latest.result == 'success' && needs.prep-latest.outputs.artifact_name != ''))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Required for npm trusted publishing. This is what replaces NPM_TOKEN.
      id-token: write
      contents: read
    steps:
      # setup-node reads .nvmrc, so the repository has to be present even though
      # we publish a pre-built artifact rather than building from this checkout.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.channel == 'latest' && 'master' || 'dev' }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      # The package was built and checked in the prep job, so publishing the
      # artifact means the tested tree is what reaches npm. It lands outside
      # deployments/ so nothing from the checkout can leak into the tarball.
      - name: Download deployments package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prep-next.outputs.artifact_name || needs.prep-latest.outputs.artifact_name }}
          path: package

      # setup-node writes a dummy NODE_AUTH_TOKEN when registry-url is set and no
      # real token exists; clear it so publish uses OIDC instead of that placeholder.
      - name: Publish
        working-directory: package
        run: |
          unset NODE_AUTH_TOKEN
          pnpm publish --tag ${{ inputs.channel }} --access public --ignore-scripts --no-git-checks

  # Raises the new version in the repositories that depend on the package.
  bump-prs:
    needs: [prep-latest, publish]
    if: always() && inputs.channel == 'latest' && needs.publish.result == 'success'
    strategy:
      matrix:
        include:
          - repo: services
            base-branch: dev
            change-type: build
      fail-fast: false
    uses: NexusMutual/workflows/.github/workflows/open-pr.yml@chore/pnpm-setup
    with:
      environment: production
      repository: ${{ matrix.repo }}
      base-branch: ${{ matrix.base-branch }}
      branch-name: "${{ matrix.change-type }}/rwi-vault-deployments-${{ needs.prep-latest.outputs.bumped_version }}-${{ github.run_id }}"
      change-command: pnpm i --save-exact @nexusmutual/rwi-vault-deployments@${{ needs.prep-latest.outputs.bumped_version }}
      commit-message: "${{ matrix.change-type }}: update @nexusmutual/rwi-vault-deployments to ${{ needs.prep-latest.outputs.bumped_version }}"
      pr-body: "Updated @nexusmutual/rwi-vault-deployments to [${{ needs.prep-latest.outputs.bumped_version }}](https://github.com/NexusMutual/rwi-vault/releases/tag/v${{ needs.prep-latest.outputs.bumped_version }})"
    secrets:
      DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
      DEPLOYER_APP_PK: ${{ secrets.DEPLOYER_APP_PK }}
