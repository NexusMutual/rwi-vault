name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  build-and-test:
    name: build & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Endpoints of the `engines.node` range (>=22.10.0 <22.18.0).
        # Running both confirms the supported range holds.
        node-version: ["22.10.0", "22.17.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build contracts
        run: pnpm exec hardhat build

      - name: Test
        run: pnpm test

  # Single aggregate context so the org `master-and-dev` ruleset can require
  # `test` without naming each matrix leg.
  test:
    name: test
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        run: '[ "${{ needs.build-and-test.result }}" = "success" ]'
